spring.application.name=bytebharat-demo-banking
server.port=8080
spring.jackson.serialization.write-dates-as-timestamps=false
spring.datasource.url=jdbc:h2:file:C:/Softwares/h2/h2 database/northstar;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# SMTP for password-reset delivery. Configure these environment variables before use.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:bytebharat@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:bytebharat@gmail.com}}
